    <style>
      /* Opening screen: the app icon's dial on navy with a faint kawung batik. One of six short
         movements plays (the script below picks it), then main.tsx fades it out. */
      #opening { position: fixed; inset: 0; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: #151A45; transition: opacity .35s ease; font-family: 'Nunito Variable', 'Nunito', ui-rounded, system-ui, sans-serif; }
      #opening .batik { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .05; }
      #opening .glow { position: absolute; inset: 0; background: radial-gradient(ellipse 70% 40% at 50% 105%, rgba(247, 189, 143, .35), transparent); }
      #opening .dial { position: relative; width: 180px; height: 180px; overflow: visible; }
      #opening .dial g { transform-box: view-box; transform-origin: 512px 512px; }
      #opening .name { position: absolute; top: calc(50% + 120px); width: 100%; text-align: center; color: #FFFFFF; font-size: 26px; font-weight: 800; }
      #opening .line { position: absolute; bottom: calc(env(safe-area-inset-bottom) + 40px); width: 100%; text-align: center; color: rgba(238, 240, 250, .78); font-size: 14px; }
      #opening.done { opacity: 0; pointer-events: none; }
      @media (prefers-reduced-motion: reduce) { #opening { transition: none; } }
    </style>

="DejaVu Sans, Helvetica, Arial" font-weight="bold" font-size="72" fill="#151A45">9</text></g><g class="l-kaabah"><g><polygon points="365,394 512,420 660,388 513,360" fill="#3D3D42"/><polygon points="365,394 512,420 512,680 365,630" fill="#262629"/><polygon points="512,420 660,388 660,626 512,680" fill="#141416"/><polygon points="365,432 512,462 512,484 365,452" fill="#D8AE52"/><polygon points="512,462 660,430 660,450 512,484" fill="#B48E3E"/></g></g><g class="l-hour"><polygon points="500.0,546.0 490.0,394.0 512.0,316.0 534.0,394.0 524.0,546.0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="16" stroke-linejoin="round"/><polygon points="500.0,546.0 490.0,394.0 512.0,316.0 534.0,394.0 524.0,546.0" fill="#151A45"/><polygon points="507.0,466.0 502.0,396.0 512.0,354.0 522.0,396.0 517.0,466.0" fill="#FFFFFF"/></g><g class="l-minute"><polygon points="502.0,554.0 494.0,316.0 512.0,244.0 530.0,316.0 522.0,554.0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="16" stroke-linejoin="round"/><polygon points="502.0,554.0 494.0,316.0 512.0,244.0 530.0,316.0 522.0,554.0" fill="#151A45"/><polygon points="508.0,462.0 504.0,318.0 512.0,280.0 520.0,318.0 516.0,462.0" fill="#FFFFFF"/></g><g class="l-hub"><circle cx="512" cy="512" r="36" fill="#FFFFFF"/><circle cx="512" cy="512" r="22" fill="#FFFFFF" stroke="#151A45" stroke-width="15"/></g></svg><!-- dial-layers:end -->
      <div class="name">Prayer Times Asia</div>
      <div class="line">Built fisabilillah in Singapore</div>
    </div>
    <script>
      // The opening screen moves for about a second, a different way each time (never the same
      // twice in a row). Settings > Opening screen can turn it off, but it always shows the first time.
      // The clock hands always land on the real time. Reduce Motion keeps the dial still.
      (function () {
        var el = document.getElementById('opening')
        function get(k) { try { return localStorage.getItem(k) } catch (e) { return null } }
        function put(k, v) { try { localStorage.setItem(k, v) } catch (e) {} }
        var prefs = {}
        try { prefs = JSON.parse(get('ptasia.preferences.v1') || '{}') || {} } catch (e) {}
        if ((get('pta-opening-seen') && prefs.showOpening === false) || /[?&]demo=/.test(location.search)) { el.remove(); return }
        put('pta-opening-seen', '1')
        var dial = el.querySelector('.dial')
        function L(n) { return dial.querySelector('.l-' + n) }
        var d = new Date(), mins = d.getMinutes() + d.getSeconds() / 60
        var hour = ((d.getHours() % 12) + mins / 60) * 30, minute = mins * 6
        L('hour').style.transform = 'rotate(' + hour + 'deg)'
        L('minute').style.transform = 'rotate(' + minute + 'deg)'
        if (!dial.animate || matchMedia('(prefers-reduced-motion: reduce)').matches) return
        var EASE = 'cubic-bezier(.2,.8,.2,1)'
        function a(node, frames, ms, delay, easing) { node.animate(frames, { duration: ms, delay: delay || 0, easing: easing || EASE, fill: 'both' }) }
        function rot(x) { return { transform: 'rotate(' + x + 'deg)' } }
        function rise(delay) {
          var up = [{ opacity: 0, transform: 'translateY(8px)' }, { opacity: 1, transform: 'none' }]
          a(el.querySelector('.name'), up, 500, delay); a(el.querySelector('.line'), up, 500, delay + 100)
        }
        var MOVES = [
          function compass() { // the ring swings like a real compass and settles on North
            a(L('ring-all'), [rot(-75), { transform: 'rotate(28deg)', offset: .38 }, { transform: 'rotate(-11deg)', offset: .62 }, { transform: 'rotate(4deg)', offset: .82 }, rot(0)], 1000, 0, 'ease-in-out')
            a(dial, [{ opacity: 0 }, { opacity: 1, offset: .2 }, { opacity: 1 }], 1000); rise(250)
          },
          function clock() { // the hands spin from twelve round to the real time
            a(L('hour'), [rot(0), rot(hour + 360)], 1000); a(L('minute'), [rot(0), rot(minute + 1080)], 1000)
            a(dial, [{ opacity: 0, transform: 'scale(.94)' }, { opacity: 1, transform: 'none' }], 400); rise(250)
          },
          function batik() { // the kawung ring turns and glows in
            a(L('batik'), [{ transform: 'rotate(-90deg)', opacity: 0 }, { transform: 'none', opacity: 1 }], 1000)
            a(dial, [{ transform: 'scale(.9)', opacity: 0 }, { transform: 'none', opacity: 1 }], 600); rise(250)
          },
          function stitch() { // the two stitch rings run opposite ways as the dial pops in
            a(L('stitch-outer'), [rot(-120), rot(0)], 1000); a(L('stitch-inner'), [rot(120), rot(0)], 1000)
            a(dial, [{ transform: 'scale(.7)', opacity: 0 }, { transform: 'scale(1.06)', opacity: 1, offset: .55 }, { transform: 'none', opacity: 1 }], 700, 0, 'ease-out'); rise(300)
          },
          function sunrise() { // dawn glows and the dial rises into place
            a(el.querySelector('.glow'), [{ opacity: 0, transform: 'translateY(30%)' }, { opacity: 1, transform: 'none' }], 1000)
            a(dial, [{ transform: 'translateY(90px) scale(.85)', opacity: 0 }, { transform: 'translateY(-6px)', opacity: 1, offset: .7 }, { transform: 'none', opacity: 1 }], 1000)
            a(L('hour'), [rot(hour - 60), rot(hour)], 1000); a(L('minute'), [rot(minute - 120), rot(minute)], 1000); rise(400)
          },
          function kaabah() { // the Kaabah first, then the face and the compass open out around it
            a(L('kaabah'), [{ transform: 'scale(.3)', opacity: 0 }, { transform: 'scale(1.15)', opacity: 1, offset: .6 }, { transform: 'none', opacity: 1 }], 450)
            ;['face', 'hub'].forEach(function (n) { a(L(n), [{ opacity: 0, transform: 'scale(.4)' }, { opacity: 1, transform: 'none' }], 450, 250) })
            a(L('hour'), [{ opacity: 0, transform: 'rotate(' + hour + 'deg) scale(.4)' }, { opacity: 1, transform: 'rotate(' + hour + 'deg)' }], 450, 250)
            a(L('minute'), [{ opacity: 0, transform: 'rotate(' + minute + 'deg) scale(.4)' }, { opacity: 1, transform: 'rotate(' + minute + 'deg)' }], 450, 250)
            a(L('ring-all'), [{ opacity: 0, transform: 'scale(.6) rotate(-40deg)' }, { opacity: 1, transform: 'none' }], 500, 500); rise(500)
          },
        ]
        var last = parseInt(get('pta-opening-last') || '-1', 10), i
        do { i = Math.floor(Math.random() * MOVES.length) } while (i === last)
        put('pta-opening-last', String(i))
        MOVES[i]()
        window.__openingMs = 1350
      })()
    </script>
    <div id="app"></div>
