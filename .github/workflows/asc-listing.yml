name: App Store listing

# Fills the App Store listing (text in EN/MS/ID, screenshots, App Review note,
# build) from docs/store-listings and design/store/app-store. Never submits
# for review. Run with mode "read" first to see what is there.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: read or write
        default: read
  pull_request:
    paths: ['.github/workflows/asc-listing.yml']

concurrency:
  group: asc-listing
  cancel-in-progress: false

jobs:
  listing:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet pyjwt cryptography
      - name: App Store Connect
        env:
          MODE: ${{ github.event.inputs.mode || 'read' }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: python3 tools/asc_listing.py
