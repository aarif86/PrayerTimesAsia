name: Release to TestFlight

# Manual-only. Needs these repo secrets (same set as Nasar Flow, but with a
# profile for this app's own bundle ID - see README "TestFlight releases"):
#   APPLE_DISTRIBUTION_CERTIFICATE_BASE64, APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD,
#   APPLE_PROVISIONING_PROFILE_BASE64, APPLE_WIDGETS_PROVISIONING_PROFILE_BASE64,
#   CI_KEYCHAIN_PASSWORD, APPLE_TEAM_ID,
#   APPLE_API_KEY_ID, APPLE_API_ISSUER_ID, APPLE_API_KEY_BASE64

on:
  workflow_dispatch:
    inputs:
      notes:
        description: "Notes for yourself about this build (not sent anywhere)"
        required: false
        default: ""

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Cheap Linux job first, so a run without signing set up stops in seconds
  # instead of spending macOS minutes.
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check signing secrets are set
        env:
          S1: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
          S2: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          S3: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          S4: ${{ secrets.APPLE_WIDGETS_PROVISIONING_PROFILE_BASE64 }}
          S5: ${{ secrets.CI_KEYCHAIN_PASSWORD }}
          S6: ${{ secrets.APPLE_TEAM_ID }}
          S7: ${{ secrets.APPLE_API_KEY_ID }}
          S8: ${{ secrets.APPLE_API_ISSUER_ID }}
          S9: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          names=(APPLE_DISTRIBUTION_CERTIFICATE_BASE64 APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD
                 APPLE_PROVISIONING_PROFILE_BASE64 APPLE_WIDGETS_PROVISIONING_PROFILE_BASE64
                 CI_KEYCHAIN_PASSWORD APPLE_TEAM_ID APPLE_API_KEY_ID APPLE_API_ISSUER_ID APPLE_API_KEY_BASE64)
          missing=""
          for i in 1 2 3 4 5 6 7 8 9; do
            v="S$i"
            if [ -z "${!v}" ]; then missing="$missing ${names[$((i-1))]}"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing signing secrets:$missing - see README 'TestFlight releases'."
            exit 1
          fi
          echo "All signing secrets present."


  release:
    needs: preflight
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Import signing certificate and both provisioning profiles
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          APP_PROVISION_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          WIDGETS_PROVISION_PROFILE_BASE64: ${{ secrets.APPLE_WIDGETS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.CI_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          missing=""
          for v in BUILD_CERTIFICATE_BASE64 P12_PASSWORD APP_PROVISION_PROFILE_BASE64 WIDGETS_PROVISION_PROFILE_BASE64 KEYCHAIN_PASSWORD; do
            if [ -z "${!v}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing signing secrets:$missing - see README 'TestFlight releases'."
            exit 1
          fi
          CERTIFICATE_PATH="$RUNNER_TEMP/distribution.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/ci-signing.keychain-db"
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 -D -o "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo -n "$APP_PROVISION_PROFILE_BASE64" | base64 -D -o ~/Library/MobileDevice/Provisioning\ Profiles/app.mobileprovision
          echo -n "$WIDGETS_PROVISION_PROFILE_BASE64" | base64 -D -o ~/Library/MobileDevice/Provisioning\ Profiles/widgets.mobileprovision

      - name: Fill in exportOptions.plist
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: sed -i '' "s/__APPLE_TEAM_ID__/$TEAM_ID/" exportOptions.plist

      - name: Archive
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild archive \
            -project PrayerTimesAsia.xcodeproj \
            -scheme PrayerTimesAsia \
            -configuration Release \
            -archivePath build/PrayerTimesAsia.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            DEVELOPMENT_TEAM="$TEAM_ID"

      - name: Export .ipa
        run: |
          xcodebuild -exportArchive \
            -archivePath build/PrayerTimesAsia.xcarchive \
            -exportPath build \
            -exportOptionsPlist exportOptions.plist

      # Export a plain .ipa, then upload separately: API-key auth (the only kind
      # that works headless) isn't supported by `destination: upload` export.
      - name: Upload to TestFlight
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p ~/.appstoreconnect/private_keys
          echo -n "$APPLE_API_KEY_BASE64" | base64 -D -o ~/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8
          IPA_PATH=$(find build -maxdepth 1 -name '*.ipa' | head -n1)
          xcrun altool --upload-app --type ios --file "$IPA_PATH" \
            --apiKey "$APPLE_API_KEY_ID" --apiIssuer "$APPLE_API_ISSUER_ID"

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PrayerTimesAsia-release-build
          path: |
            build/*.ipa
            build/PrayerTimesAsia.xcarchive/dSYMs
          if-no-files-found: ignore

      - name: Remove signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/ci-signing.keychain-db" || true
