name: iOS device shapes

# Pictures of the iPhone app on the smallest iPhone and on iPad (the iPad version is what a
# foldable iPhone would reuse). Pictures only, no tests, so it stays short. Run it by hand
# (Actions > iOS device shapes > Run workflow) or it runs on pull requests that touch ios/.
# The pictures go to the `screenshots-ios-devices-<branch>` branch. Needs no secrets.
on:
  pull_request:
    paths: ['ios/**', '.github/workflows/ios-device-shapes.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-device-shapes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shapes:
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build for Simulator
        run: |
          xcodebuild build \
            -project PrayerTimesAsia.xcodeproj \
            -scheme PrayerTimesAsia \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO
      - name: Pictures on iPhone SE and iPad
        run: |
          APP=$(find build/dd/Build/Products -name 'PrayerTimesAsia.app' -path '*iphonesimulator*' | head -n1)
          mkdir -p shots
          for pat in 'iPhone SE' 'iPad Pro.*13' 'iPad mini'; do
            LINE=$(xcrun simctl list devices available -j | jq -r --arg p "$pat" '[.devices[][] | select(.isAvailable == true and (.name | test($p)))][0] | "\(.udid)|\(.name)"')
            UDID=${LINE%%|*}; NAME=${LINE#*|}
            if [ -z "$UDID" ] || [ "$UDID" = null ]; then echo "No simulator for $pat"; continue; fi
            SLUG=$(echo "$NAME" | tr -c 'A-Za-z0-9' '-')
            echo "== $NAME"
            xcrun simctl boot "$UDID" || true
            xcrun simctl bootstatus "$UDID" -b
            xcrun simctl install "$UDID" "$APP"
            shot() {
              xcrun simctl terminate "$UDID" com.prayertimesasia.app || true
              xcrun simctl launch "$UDID" com.prayertimesasia.app "$@"
              sleep 5
            }
            shot -demo -centre -tab today;  xcrun simctl io "$UDID" screenshot "shots/$SLUG-centre-today.png"
            shot -demo -simple -light -tab today; xcrun simctl io "$UDID" screenshot "shots/$SLUG-simple-today-light.png"
            shot -demo -centre -tab qibla;  xcrun simctl io "$UDID" screenshot "shots/$SLUG-qibla.png"
            shot -demo -centre -tab settings; xcrun simctl io "$UDID" screenshot "shots/$SLUG-settings.png"
            shot -demo -centre -tab today -largetext; xcrun simctl io "$UDID" screenshot "shots/$SLUG-centre-today-big-text.png"
            xcrun simctl shutdown "$UDID" || true
          done
          ls shots
      - name: Publish the pictures
        if: always() && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          TARGET: screenshots-ios-devices-${{ github.head_ref || github.ref_name }}
        run: |
          set -e
          ls shots/*.png >/dev/null 2>&1 || { echo "No pictures"; exit 0; }
          cd shots
          git init -q -b "$TARGET"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "iOS device shape pictures for ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" "$TARGET"
