name: Probe masjid search servers
on:
  push:
    branches: [claude/overpass-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          q='[out:json][timeout:20];(nwr["amenity"="place_of_worship"]["religion"="muslim"](around:12000,1.3729,103.9493););out center tags;'
          for u in https://overpass-api.de/api/interpreter https://overpass.private.coffee/api/interpreter https://maps.mail.ru/osm/tools/overpass/api/interpreter https://overpass.kumi.systems/api/interpreter; do
            for o in "" "https://prayertimes.asia"; do
              curl -s -o o.json -D h.txt -w "$u origin=[$o] %{http_code} %{time_total}s %{size_download}B\n" --max-time 30 -G --data-urlencode "data=$q" ${o:+-H "Origin: $o"} -A "Mozilla/5.0 Chrome/130" "$u" || true
              grep -i "access-control-allow-origin" h.txt || echo "  (no CORS header)"
              head -c 200 o.json; echo; echo
            done
          done
