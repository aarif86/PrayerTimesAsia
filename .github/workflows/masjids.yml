name: Masjid lists

# Builds the ready-made masjid and surau lists for every country in
# data/countries.json from OpenStreetMap, cut into one-degree squares, and
# publishes them on the orphan `masjids` branch:
#   https://raw.githubusercontent.com/aarif86/PrayerTimesAsia/masjids/index.json
#   https://raw.githubusercontent.com/aarif86/PrayerTimesAsia/masjids/tiles/3_101.json
# The iPhone and Android apps download the few squares around them once a
# week, so the Masjid tab fills at once instead of waiting on Overpass.

on:
  schedule:
    - cron: "41 19 * * 5"   # Saturday 03:41 in Singapore, when Overpass is quiet
  push:
    branches: [main]
    paths: ['tools/build_masjid_list.py', '.github/workflows/masjids.yml']
  workflow_dispatch:
    inputs:
      countries:
        description: 'Only these country codes, space separated (empty = all)'
        required: false
        default: ''

permissions:
  contents: write   # only to publish the `masjids` branch

concurrency:
  group: masjids
  cancel-in-progress: false

jobs:
  masjids:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # the whole world, gently, one country at a time
    steps:
      - uses: actions/checkout@v4
      - name: Start from last week's lists
        run: |
          set -euo pipefail
          mkdir -p masjids
          if git fetch -q --depth 1 origin masjids 2>/dev/null; then
            git --work-tree=masjids checkout FETCH_HEAD -- . 
            git reset -q
          fi
          ls -la masjids
      - name: Build lists
        env:
          COUNTRIES: ${{ github.event.inputs.countries }}
        run: |
          # Only letters and spaces get through to the command line.
          python3 tools/build_masjid_list.py masjids $(echo "${COUNTRIES:-}" | tr -cd 'A-Za-z ')
      - name: Publish masjids branch
        run: |
          set -euo pipefail
          cd masjids
          rm -rf .git
          git init -q -b masjids
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Masjid lists for ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" masjids
          {
            echo "### Masjid lists"
            echo
            python3 -c "import json; d=json.load(open('index.json')); print(f\"{len(d['countries'])} countries, {sum(v['places'] for v in d['countries'].values())} places, {len(d['tiles'])} squares\"); print(); [print(f\"- {c}: {v['places']} places, {v['updated']}\") for c, v in sorted(d['countries'].items())]"
            echo
            echo "Largest squares:"
            ls -S tiles | head -5 | while read f; do echo "- $f $(stat -c %s tiles/$f) bytes"; done
          } >> "$GITHUB_STEP_SUMMARY"
