name: Android

on:
  push:
    branches: [main]
    paths: ['android/**', 'testdata/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'testdata/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - run: echo > build.log

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Core tests (the prayer engine, Falak, Hijri, parsers)
        run: ./gradlew :core:test 2>&1 | tee -a build.log; exit ${PIPESTATUS[0]}

      - name: Build the debug APK and an unsigned release (checks R8)
        run: ./gradlew :app:assembleDebug :app:assembleRelease 2>&1 | tee -a build.log; exit ${PIPESTATUS[0]}

      - name: App unit tests and JVM screenshots (Robolectric + Roborazzi)
        run: ./gradlew :app:recordRoborazziDebug 2>&1 | tee -a build.log; exit ${PIPESTATUS[0]}

      - name: Name the APK after the PR or commit
        id: apk
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then tag="pr${{ github.event.number }}"; else tag="${GITHUB_SHA::7}"; fi
          f=app/build/outputs/apk/debug/app-debug.apk
          [ -f "$f" ] && mv "$f" "app/build/outputs/apk/debug/prayer-times-asia-$tag.apk"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Upload the debug APK
        id: upload-apk
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prayer-times-asia-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

      - name: Say where to download the APK
        if: always() && steps.upload-apk.outputs.artifact-url != ''
        env:
          URL: ${{ steps.upload-apk.outputs.artifact-url }}
        run: |
          {
            echo "## Android test build"
            echo
            echo "[Download prayer-times-asia-${{ steps.apk.outputs.tag }}.apk]($URL) (a zip; open it on the phone and tap the .apk inside)."
            echo "Steps: android/README.md → *Install a test build on your phone*."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Post the download link on the PR
        if: >-
          always() && github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          steps.upload-apk.outputs.artifact-url != ''
        uses: actions/github-script@v7
        env:
          URL: ${{ steps.upload-apk.outputs.artifact-url }}
          TAG: ${{ steps.apk.outputs.tag }}
        with:
          script: |
            const marker = '<!-- android-test-apk -->';
            const body = `${marker}\n### 📱 Android test build\n\n` +
              `[Download the APK](${process.env.URL}) for commit ${context.payload.pull_request.head.sha.slice(0, 7)} ` +
              `(sign in to GitHub on the phone; it downloads as a zip, open it and tap \`prayer-times-asia-${process.env.TAG}.apk\`).\n\n` +
              `First time? See *Install a test build on your phone* in \`android/README.md\`. Links last 90 days.`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const mine = comments.find(c => c.body && c.body.includes(marker));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-screenshots
          path: android/app/build/outputs/roborazzi/*.png
          if-no-files-found: ignore

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            android/core/build/reports/tests/
            android/app/build/reports/tests/
          if-no-files-found: ignore

      - name: Publish screenshots to the screenshots-android branch
        if: success() && github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          mkdir -p /tmp/shots
          cp app/build/outputs/roborazzi/*.png /tmp/shots/
          cd /tmp/shots
          git init -q -b screenshots-android
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -F - <<MSG
          Android screenshots for ${GITHUB_SHA::7}

          Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_01NdiKGwEktW7nQx1d8AJQww
          MSG
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" screenshots-android

      - name: Error summary
        if: failure()
        run: |
          grep -E "^e: |What went wrong|FAILED|Exception|error:|Error:" -A3 build.log | grep -v "^\s*at " | head -150 || true
          for f in $(find . -path '*test-results*' -name '*.xml' 2>/dev/null); do
            grep -l "<failure" "$f" >/dev/null 2>&1 && grep -A8 "<failure" "$f" | head -40
          done
          true
