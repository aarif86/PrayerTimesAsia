name: App Store review

# By hand only, after the owner says go. "read" shows the waiting version, its
# build, text and screenshots. "submit" picks the build, sets manual release and
# a 7 day phased release, fills an empty What's New, and sends it to App Review.
# Nothing reaches the App Store until the owner presses Release after approval.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: read, submit, or release (only after the owner says release)
        default: read
      build:
        description: Build number to pick (empty for the newest build of the version)
        default: ""

concurrency:
  group: asc-listing
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet pyjwt cryptography
      - name: App Store Connect
        env:
          MODE: ${{ github.event.inputs.mode }}
          BUILD: ${{ github.event.inputs.build }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: python3 tools/asc_submit.py
