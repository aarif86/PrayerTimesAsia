name: TestFlight words

# Manual: puts ios/TestFlight/WhatToTest.en-US.txt on a TestFlight build and
# refreshes the beta description, with no new build. Same secrets as release.yml.

on:
  workflow_dispatch:
    inputs:
      build:
        description: "Build number (leave empty for the latest build)"
        required: false
        default: ""

jobs:
  words:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet pyjwt cryptography
      - name: Check the words
        run: python3 tools/testflight_words.py --check
      - name: Send them to App Store Connect
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          BUILD: ${{ inputs.build }}
        run: |
          if [ -n "$BUILD" ]; then python3 tools/testflight_words.py --build "$BUILD"; else python3 tools/testflight_words.py; fi
