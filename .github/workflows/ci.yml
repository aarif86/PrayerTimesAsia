name: CI

# Builds for the Simulator (no signing) and runs the unit tests on every push.
# Needs no Apple secrets - release.yml is the only workflow that does.

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'tools/validate_official.py', '.github/workflows/validate.yml', '.github/workflows/release.yml', 'docs/**', 'config/**', 'data/**', '.github/ISSUE_TEMPLATE/**', 'LICENSE', 'tools/fingerprint.py', 'tools/check_mosques.py', 'tools/check_calendar.py', 'tools/gen_ics.py', '.github/workflows/feeds.yml', 'tools/falak_reference.py', 'tools/probe_sources.py', 'functions/**', 'firebase.json', '.firebaserc', 'firestore.rules', 'storage.rules', '.github/workflows/firebase.yml', '.github/workflows/asc-status.yml', 'tools/asc_status.py']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    permissions:
      contents: write   # only to publish screenshots to the `screenshots` branch
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Check the reference engine still matches official timetables
        run: python3 tools/reference_engine.py

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for Simulator
        run: |
          xcodebuild build \
            -project PrayerTimesAsia.xcodeproj \
            -scheme PrayerTimesAsia \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO

      - name: Find an available iOS Simulator
        id: sim
        run: |
          set -euo pipefail
          NAME=$(xcrun simctl list devices available -j | jq -r '
            .devices | to_entries[] | .value[]
            | select(.isAvailable == true and (.name | test("iPhone")))
            | .name
          ' | head -n1)
          if [ -z "$NAME" ]; then xcrun simctl list devices available; exit 1; fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: |
          xcodebuild test \
            -project PrayerTimesAsia.xcodeproj \
            -scheme PrayerTimesAsia \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }},OS=latest" \
            CODE_SIGNING_ALLOWED=NO

      # Real screenshots of the app in the Simulator, in two fixed demo states
      # (-demo: home in Singapore; -demo-travel: just landed in Hanoi). Download
      # them from the run's "screenshots" artifact.
      - name: Capture screenshots
        run: |
          set -euo pipefail
          SIM="${{ steps.sim.outputs.name }}"
          # Reuses the app from "Build for Simulator" (same derived data) - no second build.
          APP=$(find build/dd/Build/Products -name 'PrayerTimesAsia.app' -path '*iphonesimulator*' | head -n1)
          UDID=$(xcrun simctl list devices available -j | jq -r --arg n "$SIM" '[.devices[][] | select(.name == $n)][0].udid')
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true
          xcrun simctl install "$UDID" "$APP"
          mkdir -p screenshots
          shot() {
            xcrun simctl terminate "$UDID" com.prayertimesasia.app || true
            xcrun simctl launch "$UDID" com.prayertimesasia.app "$@"
            sleep 6
          }
          shot -demo -tab today;          xcrun simctl io "$UDID" screenshot screenshots/1-today-singapore.png
          shot -demo -tab today -light;   xcrun simctl io "$UDID" screenshot screenshots/1b-today-light.png
          shot -demo-makkah -tab today -light; xcrun simctl io "$UDID" screenshot screenshots/1d-today-light-daytime.png
          shot -demo -tab today -more;    xcrun simctl io "$UDID" screenshot screenshots/1c-today-show-more.png
          shot -demo-travel -tab today;   xcrun simctl io "$UDID" screenshot screenshots/2-today-hanoi.png
          shot -demo-visitor -tab today;  xcrun simctl io "$UDID" screenshot screenshots/2b-today-visitor-kl.png
          shot -demo-travel -tab journey; xcrun simctl io "$UDID" screenshot screenshots/3-journey.png
          shot -demo -tab qibla;          xcrun simctl io "$UDID" screenshot screenshots/4-qibla.png
          shot -demo -tab qibla -aligned; xcrun simctl io "$UDID" screenshot screenshots/4b-qibla-aligned.png
          shot -demo -tab qibla -aligned -light; xcrun simctl io "$UDID" screenshot screenshots/4c-qibla-aligned-light.png
          shot -demo -tab falak;          xcrun simctl io "$UDID" screenshot screenshots/7-falak.png
          shot -demo -tab falak -light;   xcrun simctl io "$UDID" screenshot screenshots/7b-falak-light.png
          shot -demo -widget-preview; sleep 8; xcrun simctl io "$UDID" screenshot screenshots/8-widget-large.png
          shot -demo -tab nearby; sleep 8; xcrun simctl io "$UDID" screenshot screenshots/6-masjid.png
          shot -demo -tab settings;       xcrun simctl io "$UDID" screenshot screenshots/5-settings.png

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore

      # Also publish them on an orphan `screenshots` branch so they can be
      # viewed on github.com (and fetched with plain git) without downloading
      # the artifact zip.
      - name: Publish screenshots branch
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          # main publishes to `screenshots`; any other branch to `screenshots-<branch>`.
          BRANCH=screenshots
          if [ "${GITHUB_REF_NAME}" != "main" ]; then BRANCH="screenshots-${GITHUB_REF_NAME}"; fi
          cd screenshots
          git init -q -b "$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Screenshots for ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" "$BRANCH"
