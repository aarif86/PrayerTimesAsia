name: CI

# Builds for the Simulator (no signing) and runs the unit tests on every push.
# Needs no Apple secrets - release.yml is the only workflow that does.

on:
  push:
    branches: [main]
    paths: ['ios/**', 'data/mosques.json', 'testdata/**', 'tools/reference_engine.py', '.github/workflows/ci.yml']
  pull_request:
    # Same files as the push rule: a change with no iPhone files in it does not need the Mac build.
    paths: ['ios/**', 'data/mosques.json', 'data/app-words/**', 'testdata/**', 'tools/reference_engine.py', 'tools/testflight_words.py', '.github/workflows/ci.yml']
  workflow_dispatch:
    inputs:
      quick:
        description: 'Skip the 150 picture set (true) to get the pictures sooner'
        default: 'false'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    defaults:
      run:
        working-directory: ios
    permissions:
      contents: write   # only to publish screenshots to the `screenshots` branch
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Check the reference engine still matches official timetables
        working-directory: .
        run: python3 tools/reference_engine.py

      - name: Check the TestFlight words (length, no colons or dashes)
        working-directory: .
        run: python3 tools/testflight_words.py --check

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for Simulator
        run: |
          xcodebuild build \
            -project PrayerTimesAsia.xcodeproj \
            -scheme PrayerTimesAsia \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO

      - name: Find an available iOS Simulator
        id: sim
        run: |
          set -euo pipefail
          NAME=$(xcrun simctl list devices available -j | jq -r '
            .devices | to_entries[] | .value[]
            | select(.isAvailable == true and (.name | test("iPhone")))
            | .name
          ' | head -n1)
          if [ -z "$NAME" ]; then xcrun simctl list devices available; exit 1; fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: |
          xcodebuild test \
            -project PrayerTimesAsia.xcodeproj \
            -scheme PrayerTimesAsia \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }},OS=latest" \
            CODE_SIGNING_ALLOWED=NO

      # Real screenshots of the app in the Simulator, in two fixed demo states
      # (-demo: home in Singapore; -demo-travel: just landed in Hanoi). Download
      # them from the run's "screenshots" artifact.
      - name: Capture screenshots
        run: |
          set -euo pipefail
          SIM="${{ steps.sim.outputs.name }}"
          # Reuses the app from "Build for Simulator" (same derived data) - no second build.
          APP=$(find build/dd/Build/Products -name 'PrayerTimesAsia.app' -path '*iphonesimulator*' | head -n1)
          UDID=$(xcrun simctl list devices available -j | jq -r --arg n "$SIM" '[.devices[][] | select(.name == $n)][0].udid')
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true
          xcrun simctl install "$UDID" "$APP"
          mkdir -p screenshots
          shot() {
            xcrun simctl terminate "$UDID" com.prayertimesasia.app || true
            xcrun simctl launch "$UDID" com.prayertimesasia.app "$@"
            sleep 6
          }
          shot -demo -tab today; xcrun simctl io "$UDID" screenshot screenshots/1-today-singapore.png
          shot -demo -tab today -light; xcrun simctl io "$UDID" screenshot screenshots/1b-today-light.png
          shot -demo-makkah -tab today -light; xcrun simctl io "$UDID" screenshot screenshots/1d-today-light-daytime.png
          shot -demo -tab today -more; xcrun simctl io "$UDID" screenshot screenshots/1c-today-show-more.png
          shot -demo-travel -tab today;   xcrun simctl io "$UDID" screenshot screenshots/2-today-hanoi.png
          shot -demo-travel -tab today; xcrun simctl io "$UDID" screenshot screenshots/2c-today-hanoi-sidedial.png
          shot -demo -tab today -arrival; xcrun simctl io "$UDID" screenshot screenshots/2d-today-singapore-welcome.png
          shot -demo-travel -tab today -largetext -wake; xcrun simctl io "$UDID" screenshot screenshots/2e-today-hanoi-sidedial-big-text.png
          shot -demo-visitor -tab today;  xcrun simctl io "$UDID" screenshot screenshots/2b-today-visitor-kl.png
          shot -demo -tab today -gold;  xcrun simctl io "$UDID" screenshot screenshots/1e-today-dial.png
          shot -demo -tab today -gold -light; xcrun simctl io "$UDID" screenshot screenshots/1f-today-dial-light.png
          shot -demo -tab today -sunpath -light; xcrun simctl io "$UDID" screenshot screenshots/1g-today-sunpath-light.png
          shot -demo -tab today -centre;  xcrun simctl io "$UDID" screenshot screenshots/1j-today-centre.png
          shot -demo -tab today -centre -light; xcrun simctl io "$UDID" screenshot screenshots/1k-today-centre-light.png
          shot -demo -tab today -centre -more -auto; xcrun simctl io "$UDID" screenshot screenshots/1l-today-centre-more.png
          shot -demo -tab today -bands;   xcrun simctl io "$UDID" screenshot screenshots/1h-today-bands.png
          shot -demo -tab today -bands -more; xcrun simctl io "$UDID" screenshot screenshots/1i-today-bands-more.png
          shot -demo-travel -tab journey; xcrun simctl io "$UDID" screenshot screenshots/3-journey.png
          shot -demo -tab qibla;          xcrun simctl io "$UDID" screenshot screenshots/4-qibla.png
          shot -demo -tab qibla -aligned; xcrun simctl io "$UDID" screenshot screenshots/4b-qibla-aligned.png
          shot -demo -tab qibla -aligned -light; xcrun simctl io "$UDID" screenshot screenshots/4c-qibla-aligned-light.png
          shot -demo -tab falak;          xcrun simctl io "$UDID" screenshot screenshots/7-falak.png
          shot -demo -tab falak -light;   xcrun simctl io "$UDID" screenshot screenshots/7b-falak-light.png
          shot -demo -widget-preview; sleep 8; xcrun simctl io "$UDID" screenshot screenshots/8-widget-large.png
          for st in centre sunPath bands simple gold; do shot -demo -widget-preview -widget-style $st; sleep 8; xcrun simctl io "$UDID" screenshot screenshots/8-widget-$st.png; done
          for t in today qibla falak nearby settings; do shot -demo -auto -tab $t; sleep 4; xcrun simctl io "$UDID" screenshot screenshots/9-auto-$t.png; done
          shot -demo -tab nearby; sleep 8; xcrun simctl io "$UDID" screenshot screenshots/6-masjid.png
          shot -demo -tab nearby -masjid -eid-sample; sleep 8; xcrun simctl io "$UDID" screenshot screenshots/6b-masjid-yours-raya.png
          shot -demo -tab nearby -friday -light; sleep 8; xcrun simctl io "$UDID" screenshot screenshots/6c-masjid-friday-light.png
          shot -demo -tab settings;       xcrun simctl io "$UDID" screenshot screenshots/5-settings.png
          shot -demo -tab wakeup -wake;   xcrun simctl io "$UDID" screenshot screenshots/5b-wake-up.png
          shot -demo -tab today -centre -wake; xcrun simctl io "$UDID" screenshot screenshots/5c-today-wake-chip.png
          # Alerts and alarms (Azan, Notification, Alarm): the list and the prayer sheet in every look.
          for look in centre sunpath bands simple gold; do
            for mode in dark light; do
              flag=""; [ "$mode" = light ] && flag="-light"
              shot -demo -$look $flag -tab wakeup -wake -quiet-subuh; xcrun simctl io "$UDID" screenshot screenshots/A-alerts-$look-$mode.png
              shot -demo -$look $flag -tab wakeup -wake -quiet-subuh -alerts-sheet; xcrun simctl io "$UDID" screenshot screenshots/A-alerts-sheet-$look-$mode.png
            done
          done
          shot -demo -tab settings -settings-end; xcrun simctl io "$UDID" screenshot screenshots/5b-settings-makers.png
          # Every look, Dark and Light, on every tab: compared side by side with the web app.
          # The full set is about 150 pictures and takes most of the run, so it is made on main
          # and on manual runs. Pull requests keep the pictures above and skip this set.
          if [ "${{ github.event_name }}" != "pull_request" ] && [ "${{ github.event.inputs.quick }}" != "true" ]; then
            for look in centre sunpath bands simple gold; do
              for mode in dark light; do
                for t in today qibla falak nearby settings; do
                  flag=""; [ "$mode" = light ] && flag="-light"
                  shot -demo -$look $flag -tab $t
                  [ "$t" = nearby ] && sleep 4
                  xcrun simctl io "$UDID" screenshot "screenshots/L-$look-$mode-$t.png"
                done
              done
            done
            # The same looks in Malay and Indonesian app words, to check nothing is English or too long.
            for lang in ms id; do
              for look in centre sunpath bands simple gold; do
                for mode in dark light; do
                  flag=""; [ "$mode" = light ] && flag="-light"
                  tabs="today settings"; [ "$mode" = dark ] && tabs="today qibla falak nearby settings"
                  for t in $tabs; do
                    shot -demo -$look $flag -tab $t -words-$lang
                    [ "$t" = nearby ] && sleep 4
                    xcrun simctl io "$UDID" screenshot "screenshots/W-$lang-$look-$mode-$t.png"
                  done
                done
              done
            done
          fi

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: ios/screenshots/
          if-no-files-found: ignore

      # Also publish them on an orphan `screenshots` branch so they can be
      # viewed on github.com (and fetched with plain git) without downloading
      # the artifact zip.
      - name: Publish screenshots branch
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          # main publishes to `screenshots`; any other branch to `screenshots-<branch>`.
          BRANCH=screenshots
          if [ "${GITHUB_REF_NAME}" != "main" ]; then BRANCH="screenshots-${GITHUB_REF_NAME}"; fi
          cd screenshots
          git init -q -b "$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Screenshots for ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" "$BRANCH"
