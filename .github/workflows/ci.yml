name: CI

# Builds for the Simulator (no signing) and runs the unit tests on every push.
# Needs no Apple secrets - release.yml is the only workflow that does.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Check the reference engine still matches official timetables
        run: python3 tools/reference_engine.py

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for Simulator
        run: |
          xcodebuild build \
            -project PrayerTimesAsia.xcodeproj \
            -scheme PrayerTimesAsia \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

      - name: Find an available iOS Simulator
        id: sim
        run: |
          set -euo pipefail
          NAME=$(xcrun simctl list devices available -j | jq -r '
            .devices | to_entries[] | .value[]
            | select(.isAvailable == true and (.name | test("iPhone")))
            | .name
          ' | head -n1)
          if [ -z "$NAME" ]; then xcrun simctl list devices available; exit 1; fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: |
          xcodebuild test \
            -project PrayerTimesAsia.xcodeproj \
            -scheme PrayerTimesAsia \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }},OS=latest" \
            CODE_SIGNING_ALLOWED=NO
