name: Crash check

# Manual (or push to a claude/ branch while hunting a crash): prints crash
# reports testers shared from TestFlight, and opens the app in the Simulator
# the way a person does (no demo switches) to see if it stays open.

on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/crash-check.yml', 'tools/asc_crashes.py']

jobs:
  testflight-reports:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet pyjwt cryptography
      - name: Crash reports shared from TestFlight
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: python3 tools/asc_crashes.py

  simulator-open:
    runs-on: macos-26
    timeout-minutes: 40
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: brew install xcodegen && xcodegen generate
      - name: Build for Simulator
        run: |
          xcodebuild build -project PrayerTimesAsia.xcodeproj -scheme PrayerTimesAsia \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO -quiet
      - name: Open the app like a person does
        run: |
          set -uo pipefail
          APP=$(find build/dd/Build/Products -name 'PrayerTimesAsia.app' -path '*iphonesimulator*' | head -n1)
          NAME=$(xcrun simctl list devices available -j | jq -r '.devices | to_entries[] | .value[] | select(.isAvailable == true and (.name | test("iPhone"))) | .name' | head -n1)
          UDID=$(xcrun simctl list devices available -j | jq -r --arg n "$NAME" '[.devices[][] | select(.name == $n)][0].udid')
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl location "$UDID" set 1.3521,103.8198 || true
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl privacy "$UDID" grant location-always com.prayertimesasia.app || true
          xcrun simctl privacy "$UDID" grant location com.prayertimesasia.app || true
          xcrun simctl privacy "$UDID" grant all com.prayertimesasia.app || true
          mkdir -p ../crash-out
          for i in 1 2 3 4 5 6; do
            echo "=== Open $i"
            xcrun simctl terminate "$UDID" com.prayertimesasia.app 2>/dev/null || true
            ( xcrun simctl launch --console-pty "$UDID" com.prayertimesasia.app > ../crash-out/console-$i.txt 2>&1 & )
            sleep 25
            if xcrun simctl spawn "$UDID" launchctl list | grep -q prayertimesasia; then echo "still open"; else echo "NOT RUNNING (crashed?)"; fi
            xcrun simctl io "$UDID" screenshot ../crash-out/open-$i.png || true
            tail -40 ../crash-out/console-$i.txt || true
          done
          cp ~/Library/Logs/DiagnosticReports/*PrayerTimes* ../crash-out/ 2>/dev/null || true
          ls -la ../crash-out
          for f in ../crash-out/*.ips; do [ -f "$f" ] && head -c 15000 "$f"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crash-out
          path: crash-out
