name: Crash check

# Manual: prints the crash reports testers shared from TestFlight (they tap
# Share on the "Crashed" box), with the full crash log. Same secrets as release.yml.

on:
  workflow_dispatch:

jobs:
  testflight-reports:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet pyjwt cryptography
      - name: Crash reports shared from TestFlight
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: python3 tools/asc_crashes.py
