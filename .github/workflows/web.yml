name: Web

# Type-checks, tests and builds the web app, then deploys it to GitHub Pages at
# https://aarif86.github.io/PrayerTimesAsia/ (base path /<repo name>/).
# Pull requests only build and check; main deploys once Pages is set to
# Settings > Pages > Source: GitHub Actions. Until then the deploy is skipped.
on:
  push:
    branches: [main]
    paths: ['web/**', 'testdata/**', '.github/workflows/web.yml']
  pull_request:
    paths: ['web/**', 'testdata/**', '.github/workflows/web.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: web-${{ github.event_name == 'pull_request' && github.ref || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      pages: ${{ steps.pages.outputs.enabled }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Unit tests (prayer engine, falak, official parsers)
        run: npm test
      - name: Build
        run: npm run build
        env:
          # Pages serves a project site under /<repo name>/, case and all.
          BASE_PATH: /${{ github.event.repository.name }}/
      - name: Check the build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: |
          test -f dist/index.html
          test -f dist/sw.js
          test -f dist/manifest.webmanifest
          grep -q "${BASE_PATH}assets/" dist/index.html
          du -sh dist
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: web/dist
      - name: Is GitHub Pages set to deploy from GitHub Actions?
        id: pages
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_type=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .build_type 2>/dev/null || true)
          if [ "$build_type" = "workflow" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=GitHub Pages is not deploying from Actions::Settings > Pages > Build and deployment > Source: GitHub Actions (now: ${build_type:-off}). Then Actions > Web > Run workflow, or any push to main that touches web/."
            echo "GitHub Pages is not set up yet (source: ${build_type:-off}). Settings > Pages > Source: **GitHub Actions**, then re-run." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Which official APIs a browser may read (CORS, informational)
        continue-on-error: true
        run: |
          probe() {
            echo "== $1"
            curl -s -m 20 -o /dev/null -D - -H 'Origin: https://aarif86.github.io' "$1" | grep -iE '^HTTP|access-control-allow-origin' || echo "(no response)"
          }
          {
            echo '### CORS probe'
            echo '```'
            probe 'https://raw.githubusercontent.com/aarif86/PrayerTimesAsia/feeds/sg-muis.ics'
            probe 'https://data.gov.sg/api/action/datastore_search?resource_id=d_d441e7242e78efc566024dd5b0d9829c&limit=1'
            probe 'https://www.e-solat.gov.my/index.php?r=esolatApi/takwimsolat&period=today&zone=WLY01'
            probe 'https://api.myquran.com/v2/sholat/kota/semua'
            probe 'https://overpass-api.de/api/interpreter?data=%5Bout%3Ajson%5D%3Bnode(1)%3Bout%3B'
            probe 'https://nominatim.openstreetmap.org/search?q=Pasir%20Ris&format=jsonv2&limit=1'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && needs.build.outputs.pages == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
