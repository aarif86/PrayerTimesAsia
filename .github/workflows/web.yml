name: Web

# Type-checks, tests and builds the web app, then deploys it with the promo site
# (site/) to GitHub Pages: the promo page at the root, the app under app/.
#   No custom domain: https://aarif86.github.io/PrayerTimesAsia/ and .../app/
#   Custom domain set in Settings > Pages (e.g. prayertimes.asia): / and /app/
# The base path is picked from the Pages settings on each run, so after adding or
# removing a custom domain, run this workflow once (Actions > Web > Run workflow).
# Pull requests only build and check; main deploys once Pages is set to
# Settings > Pages > Source: GitHub Actions. Until then the deploy is skipped.
on:
  push:
    branches: [main]
    paths: ['web/**', 'site/**', 'testdata/**', 'config/analytics.json', '.github/workflows/web.yml']
  pull_request:
    paths: ['web/**', 'site/**', 'testdata/**', 'config/analytics.json', '.github/workflows/web.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: web-${{ github.event_name == 'pull_request' && github.ref || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      pages: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v5
      - name: Where does the site live? (Pages source and custom domain)
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          info=$(gh api "repos/${GITHUB_REPOSITORY}/pages" 2>/dev/null) || info='{}'
          build_type=$(jq -r '.build_type // empty' <<<"$info")
          cname=$(jq -r '.cname // empty' <<<"$info")
          # Pages serves a project site under /<repo name>/, case and all; a custom domain at the root.
          if [ -n "$cname" ]; then base=/; else base="/${REPO_NAME}/"; fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "Site base path: ${base} (custom domain: ${cname:-none})" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "${{ github.event_name }}" = pull_request ]; then exit 0; fi
          if [ "$build_type" = "workflow" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=GitHub Pages is not deploying from Actions::Settings > Pages > Build and deployment > Source: GitHub Actions (now: ${build_type:-off}). Then Actions > Web > Run workflow, or any push to main that touches web/ or site/."
            echo "GitHub Pages is not set up yet (source: ${build_type:-off}). Settings > Pages > Source: **GitHub Actions**, then re-run." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Type-check
        working-directory: web
        run: npm run typecheck
      - name: Unit tests (prayer engine, falak, official parsers)
        working-directory: web
        run: npm test
      - name: Build
        working-directory: web
        run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base }}app/
      - name: Put the promo site and the app together
        env:
          BASE: ${{ steps.pages.outputs.base }}
        run: |
          rm -rf _site
          cp -R site _site
          rm -f _site/README.md
          cp -R web/dist _site/app
          sed -i "s#__BASE__#${BASE}#g" _site/404.html
          # Visitor counts on the promo page: the App ID from config/analytics.json (empty = off).
          id=$(jq -r 'if .enabled == false then "" else (.telemetryDeckAppID // "") end' config/analytics.json | tr -cd 'A-Za-z0-9-')
          sed -i "s#__TELEMETRYDECK_APP_ID__#${id}#g" _site/index.html
          if [ -n "$id" ]; then state=on; else state="off (no App ID in config/analytics.json)"; fi
          echo "Promo page visitor counts: $state" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Check the build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base }}app/
        run: |
          test -f _site/index.html
          test -f _site/404.html
          test -f _site/sw.js
          test -f _site/app/index.html
          test -f _site/app/sw.js
          test -f _site/app/screen/index.html
          test -f _site/app/manifest.webmanifest
          grep -q "${BASE_PATH}assets/" _site/app/index.html
          ! grep -q "__BASE__" _site/404.html
          ! grep -q "__TELEMETRYDECK_APP_ID__" _site/index.html
          # Every image and page the promo page links to is there.
          for f in $(grep -oE '(src|href)="[^"#:]+"' _site/index.html | sed -E 's/^[a-z]+="//; s/"$//' | sort -u); do
            case "$f" in */) f="${f}index.html" ;; esac
            test -e "_site/$f" || { echo "::error::site/index.html links to a missing file: $f"; exit 1; }
          done
          du -sh _site _site/app
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: _site
      - name: Which official APIs a browser may read (CORS, informational)
        continue-on-error: true
        run: |
          probe() {
            echo "== $1"
            curl -s -m 20 -o /dev/null -D - -H 'Origin: https://aarif86.github.io' "$1" | grep -iE '^HTTP|access-control-allow-origin' || echo "(no response)"
          }
          {
            echo '### CORS probe'
            echo '```'
            probe 'https://raw.githubusercontent.com/aarif86/PrayerTimesAsia/feeds/sg-muis.ics'
            probe 'https://data.gov.sg/api/action/datastore_search?resource_id=d_d441e7242e78efc566024dd5b0d9829c&limit=1'
            probe 'https://www.e-solat.gov.my/index.php?r=esolatApi/takwimsolat&period=today&zone=WLY01'
            probe 'https://api.myquran.com/v2/sholat/kota/semua'
            probe 'https://overpass-api.de/api/interpreter?data=%5Bout%3Ajson%5D%3Bnode(1)%3Bout%3B'
            probe 'https://nominatim.openstreetmap.org/search?q=Pasir%20Ris&format=jsonv2&limit=1'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && needs.build.outputs.pages == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
