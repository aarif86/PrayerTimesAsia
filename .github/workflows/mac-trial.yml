name: Mac trial build

# A trial only: builds the iPhone app as a Mac app (Mac Catalyst) without
# signing, to list what stops it from compiling. It changes nothing in the
# project and ships nothing. Run by hand, or on pushes to the planning branch.

on:
  workflow_dispatch:
  push:
    branches: ['claude/project-thread-qz7zkf']
    paths: ['ios/**', '.github/workflows/mac-trial.yml']

concurrency:
  group: mac-trial-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac-catalyst:
    runs-on: macos-26
    defaults:
      run:
        working-directory: ios
    permissions:
      contents: write   # only to publish pictures to the `screenshots-mac-trial` branch
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      # Xcode only offers the Mac destination when the project itself says the
      # app supports it, so switch that on in this run's copy of project.yml.
      # Nothing is committed.
      - name: Switch on Mac support for this run only
        run: |
          perl -pi -e 's/^    SWIFT_VERSION: "5.0"$/    SWIFT_VERSION: "5.0"\n    SUPPORTS_MACCATALYST: YES/' project.yml
          grep -n "SUPPORTS_MACCATALYST" project.yml

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build as a Mac app (no signing)
        run: |
          set +e
          set -uo pipefail
          xcodebuild build \
            -project PrayerTimesAsia.xcodeproj \
            -scheme PrayerTimesAsia \
            -destination 'generic/platform=macOS,variant=Mac Catalyst' \
            -derivedDataPath build/mac \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log | tail -n 40
          STATUS=${PIPESTATUS[0]}
          {
            echo "## Mac trial build"
            if [ "$STATUS" -eq 0 ]; then echo "Built with no errors."; else echo "Did not build. Errors found:"; fi
            echo '```'
            grep -E "error:|error " build.log | grep -v "^note" | sed -E 's#^.*/ios/##' | sort -u | head -n 300 || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$STATUS"

      # Opens the built app on this cloud Mac and takes pictures of the screen.
      # The app is signed "ad hoc" (no Apple account) only so that it can start here.
      - name: Open the Mac app and take pictures
        run: |
          set -uo pipefail
          APP=$(find build/mac/Build/Products -name 'PrayerTimesAsia.app' -path '*maccatalyst*' | head -n1)
          echo "App: $APP"
          codesign --force --deep --sign - "$APP"
          mkdir -p macshots
          shot() {
            NAME=$1; shift
            pkill -x PrayerTimesAsia || true
            sleep 1
            open -n "$APP" --args "$@"
            sleep 10
            if pgrep -x PrayerTimesAsia >/dev/null; then echo "$NAME: app is running"; else echo "$NAME: app is NOT running"; fi
            screencapture -x "macshots/$NAME.png" || echo "$NAME: no picture"
          }
          shot 1-today -demo -tab today
          shot 2-today-light -demo -tab today -light
          shot 3-falak -demo -tab falak
          shot 4-masjid -demo -tab nearby
          shot 5-settings -demo -tab settings
          shot 6-travel -demo-travel -tab journey
          pkill -x PrayerTimesAsia || true
          ls -la macshots
          # Any crash report from the app, so a failed start explains itself.
          ls ~/Library/Logs/DiagnosticReports/ 2>/dev/null | grep -i prayer || echo "No crash reports."
          for f in ~/Library/Logs/DiagnosticReports/*PrayerTimesAsia*; do [ -f "$f" ] && head -n 60 "$f"; done || true

      - name: Publish the pictures
        if: always()
        run: |
          set -euo pipefail
          [ -d macshots ] && [ -n "$(ls macshots)" ] || { echo "No pictures."; exit 0; }
          cd macshots
          git init -q -b screenshots-mac-trial
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Mac trial pictures for ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" screenshots-mac-trial

      - name: Keep the full log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-trial-log
          path: ios/build.log
